; https://github.com/vike256/Unibot
; See Unibot Wiki for reference
;
; VALORANT:
;   - Settings > General > Accessibility > Enemy Highlight Color = Purple (Tritanopia)
;   - Display Mode = Windowed Fullscreen (dxcam cannot capture exclusive fullscreen)
;   - Disable Windows HDR (it shifts the captured colors and breaks detection)

[communication]
; winapi
; interception_driver
; serial
; socket
type = serial
microcontroller_ip = 0.0.0.0
microcontroller_port = 50256
; COM port of the microcontroller, e.g. 1 or COM1
com_port = 4

[screen]
; Vertical offset of the capture region, used to align it with the crosshair
screen_center_offset = 0
group_close_target_blobs_threshold = 3, 3
; Ignore blobs smaller than this many pixels (bounding box area) to skip specks
min_target_area = 4

; HSV color range for target detection.
; Defaults match VALORANT's purple enemy highlight. Recalibrate with
; https://github.com/hariangr/HsvRangeTool if you use another highlight color.
upper_color = 170, 255, 255
lower_color = 140, 70, 120

capture_fov_x = 256
capture_fov_y = 256
; Target "fps" of Unibot. 0 = uncapped (uses a full core), otherwise keep it at
; or above your monitor's refresh rate. Duplicate frames are skipped anyway.
max_loops_per_sec = 500
auto_detect_resolution = true
resolution_x = 1920
resolution_y = 1080

[trigger]
; normal = shoot anywhere on the target, hold key_trigger to activate
; head   = only shoot when the crosshair is on the head, always active (no key needed)
; both   = heads always without a key, plus anything else while the trigger key is held
mode = head
; Fraction of the target's height, measured from the top, that counts as the head
; (head mode only). Lower = stricter. Only used when the highlight includes a body;
; a head-only highlight (enemy behind cover or far away) always counts in full.
head_height = 0.2
; Extra tolerance for head mode in pixels, applied BELOW the head only. A
; tolerance above it fires while the crosshair is still over empty air, so the
; shot lands on the head edge; below it lands on the neck, which still hits.
head_threshold = 1
; Shrink the head band from the top by this many pixels. Capture plus HID
; latency means the game resolves the click a few ms after this frame, so a shot
; taken right on the head's top row can land above it. 2-4 keeps you clearly
; inside the head; 0 restores the old behaviour of firing at the very top edge.
head_inset = 2
; Base delay for triggerbot
trigger_delay = 0
; Additional random delay, does nothing if trigger_delay is 0
trigger_randomization = 30
; Max distance in pixels the crosshair can be from a target for it to fire.
; The target is no longer inflated, so this is pure tolerance: 0 = must be on it.
trigger_threshold = 3
; Maximum clicks per second sent by Unibot. Keep above the weapon's fire rate
; (Vandal/Phantom ~10/s) so full-auto keeps firing without gaps.
click_rate = 20

[key_binds]
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; F1
key_reload_config = 0x70
; F4
key_exit = 0x73
; F5 - switch between normal and head mode while playing
key_toggle_mode = 0x74
; F6 - pause/unpause the triggerbot entirely (mode stays as is)
key_toggle_pause = 0x75
; Mouse button 5 (rear side button). 0x05 = front side button.
; Must be HELD DOWN to keep the triggerbot active, release to stop.
; Pick one that is not bound to an ability in-game.
key_trigger = 0x06

[debug]
; Show a debug screen. Turn off while playing to save CPU/GPU.
enabled = false
; Refresh debug screen even if the trigger key is not held
always_on = true
; 'game' shows actual screen, 'mask' shows what opencv sees
display_mode = mask
; Capture the entire screen for the debug overlay, or just the FOV region
; Setting to false saves a lot of CPU/GPU when debug is enabled
debug_fullscreen_capture = false